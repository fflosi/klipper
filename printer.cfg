# This file contains common pin mappings for the BigTreeTech SKR 2.
# To use this config, the firmware should be compiled for the
# STM32F407 with a "32KiB bootloader".

# In newer versions of this board shipped in late 2021 the STM32F429
# is used, if this is the case compile for this with a "32KiB bootloader"
# You will need to check the chip on your board to identify which you have.
#
# The "make flash" command does not work on the SKR 2. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR 2
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# Note: The initial revision of this board has a flaw that can cause
# damage to itself and other boards. Be sure to verify the board is
# not impacted by this flaw before using it.

# Curent config 2024-06-30

#Capabilities
#70mm/s - 65mm/s vaze mode
#filament 11.7mm3/s to 12.6mm3/s at 215c
#advance initial 0.008   


[force_move]
enable_force_move: True

[stepper_x]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE3
microsteps: 32
rotation_distance: 40 # 2 mm belt pitch x 20 pulley teeth. Motor 1.8 degree
endstop_pin: ^PC1
position_min: -26
position_endstop: -26
position_max: 229
homing_speed: 20
homing_retract_dist: 0

[stepper_y]
step_pin: PD5
dir_pin: PD4
enable_pin: !PD6
microsteps: 32
rotation_distance: 40 # 2 mm belt pitch x 20 pulley teeth. Motor 1.8 degree 
endstop_pin: ^PC3
position_min: -14
position_endstop: -14
position_max: 238
homing_speed: 20
homing_retract_dist: 0

[stepper_z]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 8
rotation_distance: 2 # 8 mm lead screw with 2mm pitch. Motor 1.8 degree
endstop_pin: ^PC0
position_min: 0
position_endstop: 0
position_max: 225
homing_speed: 3
homing_retract_dist: 2.0

#[safe_z_home]
#home_xy_position: -24,-6 # position_endstop + 2mm for x and + 8 mm for y
#speed: 20
#z_hop: 3 # 3mm lift before homing
#z_hop_speed: 5


[homing_override]
axes: xyz
gcode:
    SAVE_GCODE_STATE NAME=HOMING
    {% if 'x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes and 'z' not in printer.toolhead.homed_axes%}
        SET_KINEMATIC_POSITION Z=0
        G90
        G1 Z5 F180
        G91
    {% endif %}
    {% if not 'X' in params and not 'Y' in params and not 'Z' in params %}
        G28 X0 Y0 Z0
    {% else %}
        {% if 'X' in params %}
            G90
            G1 Z5 F180
            G91
            G28 X0
        {% endif %}

        {% if 'Y' in params %}
            G90
            G1 Z5 F180
            G91
            G28 Y0
        {% endif %}
        
        {% if 'Z' in params %}
            {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes%}
                G90
                G1 Z5 F180
                G28 X0 Y0
                G91
            {% endif %}
            #G90
            #G1 Z1 F180
            #G1 X100 Y100 F1200
            G91
            G28 Z0
        {% endif %}
    {% endif %}
    RESTORE_GCODE_STATE NAME=HOMING



[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 7.712698
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: PB3
sensor_type: Generic 3950
sensor_pin: PA2
control: pid
pid_Kp: 27
pid_Ki: 3
pid_Kd: 73
min_temp: 2
max_temp: 250
min_extrude_temp: 190

#[extruder1]
#step_pin: PD11
#dir_pin: PD10
#enable_pin: !PD13
#heater_pin: PB4
#sensor_pin: PA3
#...

[heater_bed]
heater_pin: PD7
sensor_type: Generic 3950
sensor_pin: PA1
control: pid
pid_Kp: 36.76
pid_Ki: 3.43
pid_Kd: 98.63
max_power: 0.5
min_temp: 2
max_temp: 90

[fan]
pin: PB7


[heater_fan heatbreak_cooling_fan]
heater: extruder
heater_temp: 40.0
pin: PB5 # FAN 0


[controller_fan fan1]
pin: PB6 #FAN 1
idle_timeout:240



#[heater_fan fan1]
#pin: PB6

#[heater_fan fan2]
#pin: PB5

# Due to BTT implementing a Marlin-specific safety feature,
# "anti-reversal stepper protection", this pin needs pulling
# high to pass power to stepper drivers and most FETs

[output_pin motor_power]
pin: PC13
value: 1

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
serial: /dev/ttyAMA0 # connected to SKR 2 TFT
baud: 500000
restart_method: command # need to chack this

[printer]
kinematics: corexy
max_velocity: 150 #marlin 200

#marlin 900 #4k works ok with stealthchop.
max_accel: 2000
max_z_velocity: 6
max_z_accel: 250

[input_shaper]
shaper_freq_x: 23.2
shaper_freq_y: 23.2
shaper_type: zv

[bed_screws]
screw1: 7, 1
screw2: 227, 5
screw3: 117, 238


########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE10, EXP1_7=PE12, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE9, EXP1_6=PE11, EXP1_8=PE13, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

