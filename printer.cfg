#[bed_screws]
#screw1:
#   The X, Y coordinate of the first bed leveling screw. This is a
#   position to command the nozzle to that is directly above the bed
#   screw (or as close as possible while still being above the bed).
#   This parameter must be provided.
#screw1_name:
#   An arbitrary name for the given screw. This name is displayed when
#   the helper script runs. The default is to use a name based upon
#   the screw XY location.
#screw1_fine_adjust:
#   An X, Y coordinate to command the nozzle to so that one can fine
#   tune the bed leveling screw. The default is to not perform fine
#   adjustments on the bed screw.
#screw2:
#screw2_name:
#screw2_fine_adjust:
#...
#   Additional bed leveling screws. At least three screws must be
#   defined.
#horizontal_move_z: 5
#   The height (in mm) that the head should be commanded to move to
#   when moving from one screw location to the next. The default is 5.
#probe_height: 0
#   The height of the probe (in mm) after adjusting for the thermal
#   expansion of bed and nozzle. The default is zero.
#speed: 50
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
#probe_speed: 5
#   The speed (in mm/s) when moving from a horizontal_move_z position
#   to a probe_height position. The default is 5.



#Macros

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set NEXT_X = params.NEXT_X|default(31)|float %}
    {% set NEXT_Y = params.NEXT_Y|default(2)|float %}
    #NEXT_X=[next_position_x] NEXT_Y=[next_position_y]
    RESPOND MSG=" NEXT_X = {NEXT_X}"
    RESPOND MSG=" NEXT_Y = {NEXT_Y}"
    {% set PRIME_X_START = NEXT_X - 30 %}
    {% set PRIME_Y_START = NEXT_Y - 1 %}
    {% set PRIME_X_END = NEXT_X - 1 %}
    {% set PRIME_Y_END = NEXT_Y - 1 %}
    RESPOND MSG="  PRIME_X_START = {PRIME_X_START}"
    RESPOND MSG="  PRIME_Y_START = {PRIME_Y_START}"
    RESPOND MSG="  PRIME_X_END = {PRIME_X_END}"
    RESPOND MSG="  PRIME_Y_END = {PRIME_Y_END}"
    RESPOND MSG="  Command = G1 X{PRIME_X_START} Y{PRIME_Y_START} F3000"
    RESPOND MSG="  Command = G1 X{PRIME_X_END} Y{PRIME_Y_END} E3 F300"

    # Start bed heating (but don't wait for it)
    M140 S{BED_TEMP}
    # Use absolute coordinates
    G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.0
    # Feed rate 100%
    M220 S100
    # Home the printer
    G28
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    G92 E0
    G91
    G1 E8 F300
    G90
    G1 X0 Y0 F3000
    G92 E0.00000
    G1 X{PRIME_X_START} Y{PRIME_Y_START} F3000
    G1 X{PRIME_X_END} Y{PRIME_Y_END} E3 F300
    G92 E0

[gcode_macro STOP_PRINT]
description: Stop Printing
gcode:
    CANCEL_PRINT_BASE
    M104 S0 # turn off extruder
    M140 S0 # turn off bed
    M107
    G92 E0
    G91 # relative positioning
    G1 Z5 E-2 F300
    G90 # absolute positioning
    G1 X10 F2000
    M84


[gcode_macro EXTRACT_FILAMENT]
description: Extract Filament
gcode:
    M109 S195 ; heat or cool to 200c
    G92 E0
    G91 ; set relative pos
    G1 E2 F50 ; Extrude to clean filament
    G1 E-12 F5000 ; retract filament
    G1 E-40 F2000 ; retract filament
    G1 E-40 F2000 ; retract filament
    G90 ; set absolute positioning
    M18 ; shut down steppers
    M104 S0 ; shutdown heater


[gcode_macro INSERT_FILAMENT]
description: Extract Filament
gcode:
    M109 S200 ; heat or cool to 200c
    G92 E0
    G91 ; set relative pos
    G1 E40 F2000 ; extrude filament
    G1 E20 F2000 ; extrude filament
    G1 E5 F50 ; extrude filament
    G90 ; set absolute positioning
    M18 ; shut down steppers
    M104 S0 ; shutdown heater

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x + bound + 3 %} #added 3 to compensate for x y diference
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = printer.toolhead.axis_minimum.y + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    RESPOND MSG="  x_min = {x_min}"
    RESPOND MSG="  x_max = {x_max}"
    RESPOND MSG="  y_min = {y_min}"
    RESPOND MSG="  y_max = {y_max}"
    
    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    
    {% if 'a' == 'a'%}

        # Output parameters to g-code terminal
        { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
        
            # Home and get position for comparison later:
            M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
            RESPOND MSG="   G28"
            G28
            # QGL if not already QGLd (only if QGL section exists in config)
            {% if printer.configfile.settings.quad_gantry_level %}
                {% if printer.quad_gantry_level.applied == False %}
                    QUAD_GANTRY_LEVEL
                    G28 Z
                {% endif %}
            {% endif %} 
            # Move 10mm away for first Home
            G90
            G1 X{10} Y{10} F{30*60}
            M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
            RESPOND MSG="   G28 X Y"
            G28 X Y
            RESPOND MSG="   G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}"
            G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
            G4 P3000 
            GET_POSITION
    
        # Go to starting position Z always 7mm
        RESPOND MSG="  G0 X{x_min} Y{y_min} Z{7} F{speed*60}"
        G0 X{x_min} Y{y_min} Z{7} F{speed*60} # original Z{bound + 10}
    
        # Set new limits
        {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
            SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
        {% else %}
            SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
        {% endif %}
        
        {% set accelAdjA = 1 %}
        {% set accelAdjB = 1 %}
        
        {% for i in range(iterations) %}
            RESPOND MSG="  For {i}"
            {% if 'x' == 'x'%}
                RESPOND MSG="  Large pattern diagonals"
                # Large pattern diagonals
                RESPOND MSG="  G0 X{x_min} Y{y_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_min} Y{y_min} F{speed*60}
                RESPOND MSG="  G0 X{x_max} Y{y_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_max} Y{y_max} F{speed*60}
                RESPOND MSG="  G0 X{x_min} Y{y_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_min} Y{y_min} F{speed*60}
                RESPOND MSG="  G0 X{x_max} Y{y_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_max} Y{y_min} F{speed*60}
                RESPOND MSG="  G0 X{x_min} Y{y_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_min} Y{y_max} F{speed*60}
                RESPOND MSG="  G0 X{x_max} Y{y_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_max} Y{y_min} F{speed*60}
            {% endif %}
            
            {% if 'x' == 'x'%}
                RESPOND MSG="  Large pattern box"
                # Large pattern box
                RESPOND MSG="  G0 X{x_min} Y{y_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_min} Y{y_min} F{speed*60}
            
                RESPOND MSG="  G0 X{x_min} Y{y_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_min} Y{y_max} F{speed*60}
            
                RESPOND MSG="  G0 X{x_max} Y{y_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_max} Y{y_max} F{speed*60}
            
                RESPOND MSG="  G0 X{x_max} Y{y_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_max} Y{y_min} F{speed*60}
            {% endif %}
            
            {% if 'x' == 'x'%}
                RESPOND MSG="  Small pattern diagonals"
                # Small pattern diagonals
                RESPOND MSG="  G0 X{x_center_min} Y{y_center_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_center_min} Y{y_center_min} F{speed*60}

                RESPOND MSG="  G0 X{x_center_max} Y{y_center_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_center_max} Y{y_center_max} F{speed*60}

                RESPOND MSG="  G0 X{x_center_min} Y{y_center_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_center_min} Y{y_center_min} F{speed*60}

                RESPOND MSG="  G0 X{x_center_max} Y{y_center_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_center_max} Y{y_center_min} F{speed*60}

                RESPOND MSG="  G0 X{x_center_min} Y{y_center_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_center_min} Y{y_center_max} F{speed*60}

                RESPOND MSG="  G0 X{x_center_max} Y{y_center_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_center_max} Y{y_center_min} F{speed*60}
            {% endif %}
                
            {% if 'x' == 'x'%}
                RESPOND MSG="  Small pattern box"
                # Small pattern box
                RESPOND MSG="  G0 X{x_center_min} Y{y_center_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_center_min} Y{y_center_min} F{speed*60}

                RESPOND MSG="  G0 X{x_center_min} Y{y_center_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_center_min} Y{y_center_max} F{speed*60}

                RESPOND MSG="  G0 X{x_center_max} Y{y_center_max} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjA}
                G0 X{x_center_max} Y{y_center_max} F{speed*60}

                RESPOND MSG="  G0 X{x_center_max} Y{y_center_min} F{speed*60}"
                SET_VELOCITY_LIMIT ACCEL={accel/accelAdjB}
                G0 X{x_center_max} Y{y_center_min} F{speed*60}
            {% endif %}
        {% endfor %}

    
        # Restore max speed/accel/accel_to_decel to their configured values
        {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
            SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
        {% else %}
            SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
        {% endif %}
    
        # Re-home and get position again for comparison:
            M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
            RESPOND MSG="   G28"
            G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
            # Go to XY home positions (in case your homing override leaves it elsewhere)
            G90
            RESPOND MSG="  G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}"
            G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
            G4 P3000 
            GET_POSITION
            M400
            G4 P3000
            G0 X1 Y1 F2000    
        # Restore previous gcode state (absolute/relative, etc)
        RESTORE_GCODE_STATE NAME=TEST_SPEED
    {% endif %}
