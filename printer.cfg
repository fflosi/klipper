[gcode_macro END_PRINT]
gcode:

    M400; finish moves
    M220 S100 ; Feed rate 100%
    M77 ; stop print timer
    M104 S0 # turn off extruder
    M140 S0 # turn off bed
    M107
    G92 E0
    G91 # relative positioning
    G1 Z5 E-2 F300
    G90 # absolute positioning
    G1 X-6 Y-6 F2000
    M84
    





