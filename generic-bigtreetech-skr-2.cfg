# This file contains common pin mappings for the BigTreeTech SKR 2.
# To use this config, the firmware should be compiled for the
# STM32F407 with a "32KiB bootloader".

# In newer versions of this board shipped in late 2021 the STM32F429
# is used, if this is the case compile for this with a "32KiB bootloader"
# You will need to check the chip on your board to identify which you have.
#
# The "make flash" command does not work on the SKR 2. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR 2
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# Note: The initial revision of this board has a flaw that can cause
# damage to itself and other boards. Be sure to verify the board is
# not impacted by this flaw before using it.

# Curent config 2024-06-30


[stepper_x]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE3
microsteps: 32
rotation_distance: 40 # 2 mm belt pitch x 20 pulley teeth. Motor 1.8 degree
endstop_pin: ^PC1
position_endstop: -26
position_max: 229
homing_speed: 40
homing_retract_dist: 5.0

[stepper_y]
step_pin: PD5
dir_pin: !PD4
enable_pin: !PD6
microsteps: 32
rotation_distance: 40 # 2 mm belt pitch x 20 pulley teeth. Motor 1.8 degree 
endstop_pin: ^PC3
position_endstop: -14
position_max: 238
homing_speed: 40
homing_retract_dist: 5.0

[stepper_z]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
microsteps: 8
rotation_distance: 2 # 8 mm lead screw with 2mm pitch. Motor 1.8 degree
endstop_pin: ^PC0
position_endstop: 0
position_max: 225
homing_speed: 40
homing_retract_dist: 5.0

[safe_z_home]
home_xy_position: -24,-6 # position_endstop + 2mm for x and + 8 mm for y
speed: 40.0
z_hop: 3 # 3mm lift before homing
z_hop_speed: 5


[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 7.8701 #based on marlin data. need to be checked
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: PB3
sensor_type: Generic 3950
sensor_pin: PA2
control: pid
pid_Kp: 27
pid_Ki: 3
pid_Kd: 73
min_temp: 2
max_temp: 250
min_extrude_temp: 190

#[extruder1]
#step_pin: PD11
#dir_pin: PD10
#enable_pin: !PD13
#heater_pin: PB4
#sensor_pin: PA3
#...

[heater_bed]
heater_pin: PD7
sensor_type: Generic 3950
sensor_pin: PA1
control: pid
pid_Kp: 36.76
pid_Ki: 3.43
pid_Kd: 98.63
max_power: 0.5
min_temp: 2
max_temp: 90

[fan]
pin: PB7


[heater_fan heatbreak_cooling_fan]
heater: extruder
heater_temp: 45.0
pin: PB5 # FAN 0


[controller_fan]
pin: PB6 #FAN 1
idle_timeout:240



#[heater_fan fan1]
#pin: PB6

#[heater_fan fan2]
#pin: PB5

# Due to BTT implementing a Marlin-specific safety feature,
# "anti-reversal stepper protection", this pin needs pulling
# high to pass power to stepper drivers and most FETs

[output_pin motor_power]
pin: PC13
value: 1

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
serial: /dev/ttyAMA0 # connected to SKR 2 TFT
baud: 500000
restart_method: command # need to chack this

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 900
max_z_velocity: 6
max_z_accel: 250

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE10, EXP1_7=PE12, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE9, EXP1_6=PE11, EXP1_8=PE13, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PE0
run_current: 0.900
#diag_pin:
interpolate: False
stealthchop_threshold:100

[tmc2209 stepper_y]
uart_pin: PD3
run_current: 0.900
#diag_pin:
interpolate: False
stealthchop_threshold:100

[tmc2130 stepper_z]
uart_pin: PD0
run_current: 0.700
hold_current: 0.350
#diag_pin:
interpolate: False
stealthchop_threshold:3

[tmc2130 extruder]
uart_pin: PC6
#run_current: 0.600
#diag_pin:
interpolate: False
stealthchop_threshold:30

[idle_timeout]
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
    {% else %}
        TURN_OFF_HEATERS
    M84
    {% endif %}
timeout: 600

[pause_resume]
recover_velocity: 40

sensor_type: temperature_mcu
sensor_mcu: mcu


